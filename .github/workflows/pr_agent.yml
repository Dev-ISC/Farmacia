name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: PR Agent action step
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OPENAI.API_BASE: ${{ secrets.OMNIROUTE_BASE_URL }}
          config.model: "openai/antigravity/gemini-3.8-flash-high"
          config.fallback_models: '["openai/antigravity/gemini-3.8-flash-high"]'
          config.custom_model_max_tokens: "64000"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "false"
